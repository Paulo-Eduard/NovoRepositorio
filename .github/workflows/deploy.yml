name: CD - Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pipeline segura completa (Lint -> Testes -> SAST -> DAST -> DefectDojo)
  ci:
    name: Validacoes (CI)
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read

  deploy:
    name: Publicar no GitHub Pages
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Publicar site na branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: ".github,tests,.zap,docs,README.md,.gitignore"
